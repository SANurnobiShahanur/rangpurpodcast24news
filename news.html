<script>
const SUPABASE_URL = "https://jjiqzupumcabyjjsqtec.supabase.co";
const SUPABASE_KEY = "sb_publishable_Yk8anVM0MfpNRN1EMsGFsw_omYb-uZe";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const fallbackImage =
 "https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=1000";

document.getElementById("year").textContent =
 new Date().getFullYear();

function showError(message){
 document.getElementById("loading").hidden = true;

 const error = document.getElementById("error");
 error.hidden = false;
 error.textContent = message;
}

function formatDate(value){
 if(!value) return "";

 const date = new Date(value);

 if(isNaN(date.getTime())) return "";

 return date.toLocaleDateString("bn-BD",{
  year:"numeric",
  month:"long",
  day:"numeric"
 });
}

async function loadArticle(){
 const id = new URLSearchParams(
  window.location.search
 ).get("id");

 if(!id || !/^\d+$/.test(id)){
  showError(
   "সংবাদের সঠিক আইডি পাওয়া যায়নি। হোমপেজ থেকে সংবাদ নির্বাচন করুন।"
  );
  return;
 }

 try{
  const [newsResult,categoryResult] = await Promise.all([

   db.from("news")
    .select("id,title,content,image_url,category_id,author_name,created_at,published_at")
    .eq("id",Number(id))
    .eq("status","published")
    .maybeSingle(),

   db.from("categories")
    .select("id,name")

  ]);

  if(newsResult.error) throw newsResult.error;
  if(categoryResult.error) throw categoryResult.error;

  const news = newsResult.data;

  if(!news){
   showError("সংবাদটি পাওয়া যায়নি অথবা এটি প্রকাশিত নয়।");
   return;
  }

  // প্রকাশিত সংবাদে ভিউ কাউন্টার চালু
  let viewCount = null;

  try{
   const viewResult = await db.rpc(
    "increment_news_view",
    {
     p_news_id: Number(id)
    }
   );

   if(viewResult.error){
    console.warn("ভিউ কাউন্টার আপডেট হয়নি:",viewResult.error);
   }else{
    viewCount = viewResult.data;
   }

  }catch(viewError){
   console.warn("ভিউ কাউন্টার সমস্যা:",viewError);
  }

  const categories = categoryResult.data || [];

  const category = categories.find(
   c => String(c.id) === String(news.category_id)
  );

  document.getElementById("category").textContent =
   category ? category.name : "অন্যান্য";

  document.getElementById("title").textContent =
   news.title;

  let metaText =
   "প্রতিবেদক: " +
   (news.author_name || "নিজস্ব প্রতিবেদক") +
   " | প্রকাশিত: " +
   formatDate(news.published_at || news.created_at);

  if(viewCount !== null){
   metaText += " | পঠিত: " +
    Number(viewCount).toLocaleString("bn-BD") +
    " বার";
  }

  document.getElementById("meta").textContent =
   metaText;

  const cover = document.getElementById("cover");

  cover.src = news.image_url || fallbackImage;
  cover.alt = news.title;

  cover.onerror = ()=>{
   cover.src = fallbackImage;
  };

  document.getElementById("content").textContent =
   news.content;

  document.title =
   news.title + " | Rangpur Podcast24 News";

  document.querySelector(
   'meta[name="description"]'
  ).setAttribute(
   "content",
   news.content.slice(0,150)
  );

  const pageUrl = window.location.href;
  const shareText =
   news.title + " - Rangpur Podcast24 News";

  document.getElementById("facebookShare").href =
   "https://www.facebook.com/sharer/sharer.php?u=" +
   encodeURIComponent(pageUrl);

  document.getElementById("whatsappShare").href =
   "https://api.whatsapp.com/send?text=" +
   encodeURIComponent(shareText+" "+pageUrl);

  document.getElementById("copyLink")
   .addEventListener("click",async()=>{
    const button = document.getElementById("copyLink");

    try{
     await navigator.clipboard.writeText(pageUrl);
     button.textContent = "লিংক কপি হয়েছে ✓";
    }catch(e){
     button.textContent = "লিংক কপি করা যায়নি";
    }
   });

  document.getElementById("loading").hidden = true;
  document.getElementById("article").hidden = false;

 }catch(error){
  console.error(error);

  showError(
   "সংবাদ লোড করা যায়নি। ইন্টারনেট অথবা ডেটাবেজ সংযোগ পরীক্ষা করুন।"
  );
 }
}

loadArticle();
</script>
